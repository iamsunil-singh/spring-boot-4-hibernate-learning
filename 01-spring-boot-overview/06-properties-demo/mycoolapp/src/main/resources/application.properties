spring.application.name=mycoolapp

# ===== Logging =====
spring.main.banner-mode=off
spring.devtools.restart.log-condition-evaluation-delta=false
logging.pattern.console=%-5level %msg%n

# ===== Server =====
server.port=7070
server.servlet.context-path=/mycloolapp

# ===== Actuator =====
# Expose all endpoints (fine for learning, NOT for production)
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=health,info

# Exclude individual endpoints with a comma-delimited list
#management.endpoints.web.exposure.exclude=health,info

management.info.env.enabled=true
info.app.name=My Super Cool App
info.app.description=A crazy fun app, yoohoo!
info.app.version=1.0.0

# ===== Custom properties =====
coach.name=Sunil
team.name=Akmira